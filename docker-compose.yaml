version: '3.8'

services:
  # -------------------------------
  # REDIS - Driver Location Storage
  # -------------------------------
  redis:
    image: redis:7
    container_name: redis-geo
    ports:
      - "6379:6379"
    networks:
      - rideshare-network

  # -------------------------------
  # POSTGRES - Ride Data Storage
  # -------------------------------
  postgres:
    image: postgres:15
    container_name: postgres-rideshare
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ride_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rideshare-network

  # -------------------------------
  # ZOOKEEPER - Required by Kafka
  # -------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rideshare-network

  # -------------------------------
  # KAFKA - Event Streaming
  # -------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - rideshare-network

# -------------------------------
# NETWORKS
# -------------------------------
networks:
  rideshare-network:

# -------------------------------
# VOLUMES
# -------------------------------
volumes:
  postgres_data: